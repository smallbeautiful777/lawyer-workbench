<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>个人执业律师工作台</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#6C5CE7"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="律师工作台"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<style>
  :root{
    --bg:#F5F3FC; --card:#FFFFFF; --primary:#6C5CE7; --primary-dark:#5847C7;
    --grad:linear-gradient(135deg,#8E7CF6 0%,#6C5CE7 100%);
    --text:#211F36; --sub:#8B8AA3; --border:#EDEAF9;
    --danger:#FF6B6B; --danger-bg:#FFEDED;
    --warn:#FFA940; --warn-bg:#FFF4E0;
    --good:#40C463; --good-bg:#E7F9EC;
    --amber-bg:#FFF9E0; --amber:#D4A017;
  }
  *{box-sizing:border-box;}
  body,html{margin:0;padding:0;background:var(--bg);font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;}
  .app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px;}
  .topbar h1{font-size:19px;margin:0;font-weight:700;color:var(--text);}
  .topbar .actions{display:flex;gap:10px;align-items:center;}
  .iconbtn{width:32px;height:32px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);cursor:pointer;color:var(--sub);font-size:14px;}
  .content{flex:1;overflow-y:auto;padding:0 16px 90px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-card{border-radius:16px;padding:14px 16px;}
  .stat-card .label{font-size:13px;font-weight:600;opacity:.85;}
  .stat-card .value{font-size:26px;font-weight:800;margin-top:6px;}
  .stat-card .sub{font-size:11px;opacity:.7;margin-top:2px;}
  .stat-card.blue{background:#EDEBFF;color:#5847C7;}
  .stat-card.orange{background:#FFF0E4;color:#D9720B;}
  .stat-card.purple{background:#F1E9FF;color:#7A3FE0;}
  .stat-card.amber{background:#FFF4D6;color:#B8860B;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;}
  .section-head h3{font-size:15px;margin:0;color:var(--text);font-weight:700;}
  .section-head .more{font-size:12px;color:var(--sub);cursor:pointer;}
  .banner{background:var(--grad);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-weight:600;}
  .card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;}
  .row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .card .title{font-weight:700;font-size:14.5px;color:var(--text);}
  .card .meta{font-size:12.5px;color:var(--sub);margin-top:4px;}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .pill.danger{background:var(--danger-bg);color:var(--danger);}
  .pill.warn{background:var(--warn-bg);color:var(--warn);}
  .pill.good{background:var(--good-bg);color:var(--good);}
  .pill.amber{background:var(--amber-bg);color:var(--amber);}
  .pill.gray{background:#F1F0F7;color:var(--sub);}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#F1EEFC;color:#6C5CE7;margin-right:6px;font-weight:600;}
  .tabs{display:flex;gap:6px;margin:10px 0 14px;overflow-x:auto;}
  .tab-btn{flex:0 0 auto;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--sub);background:var(--card);border:1px solid var(--border);cursor:pointer;}
  .tab-btn.active{background:var(--grad);color:#fff;border-color:transparent;}
  .navbar{position:sticky;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom));}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);cursor:pointer;}
  .navitem.active{color:var(--primary);font-weight:700;}
  .navitem .ic{font-size:19px;}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 10px;}
  .overlay{position:fixed;inset:0;background:rgba(20,15,50,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px;max-height:86vh;overflow-y:auto;}
  .sheet h3{margin:0 0 14px;font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);font-size:14px;background:#FAF9FF;font-family:inherit;}
  .field textarea{resize:vertical;min-height:50px;}
  .sheet-actions{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;padding:11px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--grad);color:#fff;}
  .btn.ghost{background:#F1F0F7;color:var(--text);}
  .btn.small{flex:none;padding:6px 12px;font-size:12px;}
  .segmented{display:flex;gap:6px;flex-wrap:wrap;}
  .seg-opt{padding:6px 12px;border-radius:9px;border:1px solid var(--border);font-size:12.5px;cursor:pointer;color:var(--sub);background:#FAF9FF;}
  .seg-opt.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .loading{text-align:center;padding:60px 20px;color:var(--sub);font-size:13px;}
  .versionrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .versionrow:last-child{border-bottom:none;}
  .quickgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px;}
  .quickitem{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;}
  .quickitem .ic2{font-size:20px;margin-bottom:4px;}
  .quickitem .lb{font-size:11.5px;color:var(--text);font-weight:600;}
  .backbar{display:flex;align-items:center;gap:8px;padding:16px 16px 4px;}
  .backbar .backbtn{cursor:pointer;font-size:18px;color:var(--sub);}
  .backbar h2{font-size:17px;margin:0;font-weight:700;}
  .filebtn{display:inline-block;font-size:12px;color:var(--primary);font-weight:700;cursor:pointer;margin-top:6px;}
  /* login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:#fff;border-radius:20px;padding:32px 26px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(108,92,231,.15);}
  .login-card h1{font-size:20px;margin:0 0 4px;color:var(--text);}
  .login-card p{font-size:13px;color:var(--sub);margin:0 0 20px;}
  .login-err{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:16px;}
</style>
</head>
<body>
<div id="app"><div class="loading">加载中…</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://pxcykfetakldefcqlpmt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4Y3lrZmV0YWtsZGVmY3FscG10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ0NjgsImV4cCI6MjEwMDkzMDQ2OH0.34QQrG0uQhZc-hfzZjxPZX0W3vWpv7kQtEfYJtSwpGM';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

let session = null;
let db = { cases:[], deadlines:[], tasks:[], evidence:[], documents:[], documentVersions:[], comms:[], payments:[], courts:[], judges:[], lawyers:[], caseLawyers:[] };
let state = { tab:'home', view:null, caseFilter:'all', taskFilter:'all', deadlineFilter:'all', evidenceFilter:'all', lawyerFilter:'all', selectedCaseId:null, modal:null };

const TABLE_MAP = { cases:'cases', deadlines:'deadlines', tasks:'tasks', evidence:'evidence', documents:'documents', documentVersions:'document_versions', comms:'comms', payments:'payments', courts:'courts', judges:'judges', lawyers:'lawyers', caseLawyers:'case_lawyers' };

const uid = () => 'tmp' + Math.random().toString(36).slice(2,10);
const todayStr = () => new Date().toISOString().slice(0,10);
function fmtDate(d){ if(!d) return ''; return d.toString().replace('T',' ').slice(0,16); }
function daysLeft(dateStr){
  if(!dateStr) return null;
  const due = new Date(dateStr);
  const now = new Date();
  const ms = due.setHours(23,59,59,999) - now.getTime();
  return Math.ceil(ms/86400000);
}
function riskPillClass(risk){ if(risk==='高风险') return 'danger'; if(risk==='中风险') return 'warn'; return 'good'; }
function urgencyPill(days){
  if(days===null) return {cls:'gray', txt:'无期限'};
  if(days<0) return {cls:'danger', txt:`已逾期${Math.abs(days)}天`};
  if(days===0) return {cls:'danger', txt:'今日到期'};
  if(days<=1) return {cls:'danger', txt:`剩余${days}天`};
  if(days<=3) return {cls:'warn', txt:`剩余${days}天`};
  if(days<=7) return {cls:'amber', txt:`剩余${days}天`};
  return {cls:'good', txt:`剩余${days}天`};
}
function caseName(id){ const c = db.cases.find(x=>x.id===id); return c ? c.title : '未关联案件'; }
function courtName(id){ const c = db.courts.find(x=>x.id===id); return c ? c.name : ''; }
function judgeName(id){ const j = db.judges.find(x=>x.id===id); return j ? j.name : ''; }
function escapeHtml(s){ return (s==null?'':s.toString()).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function refetch(key){
  const table = TABLE_MAP[key];
  const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending:false });
  if(!error) db[key] = data || [];
  else console.error('fetch error', table, error);
}
async function loadAll(){ await Promise.all(Object.keys(TABLE_MAP).map(refetch)); }

// ---------- AUTH ----------
async function initAuth(){
  const { data } = await supabase.auth.getSession();
  session = data.session;
  supabase.auth.onAuthStateChange((_event, s) => {
    session = s;
    if(session) { loadAll().then(render); } else { render(); }
  });
  if(session){ await loadAll(); }
  render();
}

function renderLogin(err){
  document.getElementById('app').innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <h1>个人执业律师工作台</h1>
      <p>登录你的账号，数据只有你能看到</p>
      <div class="field"><label>邮箱</label><input id="login-email" type="email" placeholder="you@example.com"/></div>
      <div class="field"><label>密码</label><input id="login-pw" type="password" placeholder="密码"/></div>
      <button class="btn primary" style="width:100%;" id="login-btn">登录</button>
      <div class="login-err">${err?escapeHtml(err):''}</div>
    </div>
  </div>`;
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('login-pw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pw').value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error) renderLogin(error.message==='Invalid login credentials' ? '邮箱或密码不正确' : error.message);
}
async function doLogout(){ await supabase.auth.signOut(); state = {tab:'home', view:null, caseFilter:'all', taskFilter:'all', deadlineFilter:'all', evidenceFilter:'all', selectedCaseId:null, modal:null}; }

// ---------- RENDER ----------
function render(){
  if(!session){ renderLogin(); return; }
  const app = document.getElementById('app');
  let body = '';
  if(state.view==='evidence') body = renderEvidence();
  else if(state.view==='documents') body = renderDocuments();
  else if(state.view==='comms') body = renderComms();
  else if(state.view==='lawyers') body = renderLawyers();
  else if(state.view==='caseDetail') body = renderCaseDetail();
  else if(state.tab==='home') body = renderHome();
  else if(state.tab==='cases') body = renderCases();
  else if(state.tab==='tasks') body = renderTasks();
  else if(state.tab==='deadlines') body = renderDeadlines();
  else if(state.tab==='me') body = renderMe();
  app.innerHTML = `<div class="app">${body}${renderNav()}</div>`;
  if(state.modal) renderModal();
  attachEvents();
}
function renderNav(){
  const items = [
    {key:'home', ic:'🏠', label:'首页'}, {key:'cases', ic:'📁', label:'案件'},
    {key:'tasks', ic:'✅', label:'任务'}, {key:'deadlines', ic:'📅', label:'期限'}, {key:'me', ic:'👤', label:'我的'},
  ];
  return `<div class="navbar">${items.map(it=>`
    <div class="navitem ${state.tab===it.key && !state.view?'active':''}" data-nav="${it.key}">
      <div class="ic">${it.ic}</div><div>${it.label}</div>
    </div>`).join('')}</div>`;
}

function renderHome(){
  const todayTasks = db.tasks.filter(t=>t.status!=='已完成' && t.due_date<=todayStr());
  const upcoming = db.deadlines.filter(d=>!d.completed && daysLeft(d.due_date)<=7);
  const overdueCount = db.deadlines.filter(d=>!d.completed && daysLeft(d.due_date)<0).length + db.tasks.filter(t=>t.status!=='已完成' && t.due_date<todayStr()).length;
  const hearingsToday = db.cases.filter(c=>c.hearing_date && c.hearing_date.slice(0,10)===todayStr());
  const upcomingHearings = db.cases.filter(c=>c.hearing_date && daysLeft(c.hearing_date.slice(0,10))!==null && daysLeft(c.hearing_date.slice(0,10))>=0 && daysLeft(c.hearing_date.slice(0,10))<=7);
  const unpaidTotal = db.payments.filter(p=>p.status!=='已回款').reduce((s,p)=>s+Number(p.unpaid||0),0);
  const unpaidCount = db.payments.filter(p=>p.status!=='已回款').length;
  const riskDeadlines = [...db.deadlines].filter(d=>!d.completed).sort((a,b)=>daysLeft(a.due_date)-daysLeft(b.due_date)).slice(0,4);
  const todoList = db.tasks.filter(t=>t.status!=='已完成').slice(0,3);

  return `
  <div class="topbar"><h1>个人执业律师工作台</h1><div class="actions"><div class="iconbtn" data-logout>⎋</div></div></div>
  <div class="content">
    ${overdueCount>0? `<div class="banner">⚠️ 你有 ${overdueCount} 项已逾期或今日到期，点开"期限"或"任务"看看</div>` : ''}
    <div class="stat-grid">
      <div class="stat-card blue"><div class="label">今日待办</div><div class="value">${todayTasks.length}</div><div class="sub">今日到期且未完成</div></div>
      <div class="stat-card orange"><div class="label">即将到期</div><div class="value">${upcoming.length}</div><div class="sub">7日内待处理/逾期</div></div>
      <div class="stat-card purple"><div class="label">今日开庭</div><div class="value">${hearingsToday.length}</div><div class="sub">${hearingsToday[0]?fmtDate(hearingsToday[0].hearing_date):'今日暂无'}</div></div>
      <div class="stat-card amber"><div class="label">未回款金额</div><div class="value">¥${unpaidTotal.toLocaleString()}</div><div class="sub">${unpaidCount}条未结清记录</div></div>
    </div>

    ${upcomingHearings.length? `<div class="section-head"><h3>近期开庭</h3></div>${upcomingHearings.map(c=>`
      <div class="card" data-open-case="${c.id}">
        <div class="row"><div class="title">${escapeHtml(c.title)}</div><span class="pill amber">${fmtDate(c.hearing_date)}</span></div>
        <div class="meta">${escapeHtml(courtName(c.court_id))} ${judgeName(c.judge_id)?'· 承办法官 '+escapeHtml(judgeName(c.judge_id)):''}</div>
      </div>`).join('')}` : ''}

    <div class="section-head"><h3>期限风险</h3><span class="more" data-nav="deadlines">全部 ›</span></div>
    ${riskDeadlines.length? riskDeadlines.map(d=>{ const u=urgencyPill(daysLeft(d.due_date)); return `
      <div class="card" data-open-case="${d.case_id}">
        <div class="row"><div class="title">${escapeHtml(d.title)}</div><span class="pill ${u.cls}">${u.txt}</span></div>
        <div class="meta">${escapeHtml(caseName(d.case_id))} · ${escapeHtml(d.category||'')} · ${d.due_date||''}</div>
      </div>`;}).join('') : `<div class="empty">暂无临近期限</div>`}

    <div class="section-head"><h3>今日待办</h3><span class="more" data-nav="tasks">全部(${db.tasks.length}) ›</span></div>
    ${todoList.length? todoList.map(t=>`
      <div class="card" data-open-case="${t.case_id}">
        <div class="row"><div class="title">${escapeHtml(t.title)}</div><span class="pill gray">${escapeHtml(t.status)}</span></div>
        <div class="meta">${escapeHtml(caseName(t.case_id))} · ${t.due_date||''}</div>
      </div>`).join('') : `<div class="empty">今日暂无待办</div>`}

    <div class="section-head"><h3>快捷入口</h3></div>
    <div class="quickgrid">
      <div class="quickitem" data-nav="cases"><div class="ic2">📁</div><div class="lb">案件管理</div></div>
      <div class="quickitem" data-nav="deadlines"><div class="ic2">📅</div><div class="lb">期限管理</div></div>
      <div class="quickitem" data-nav="tasks"><div class="ic2">✅</div><div class="lb">任务管理</div></div>
      <div class="quickitem" data-view="evidence"><div class="ic2">🗂️</div><div class="lb">证据管理</div></div>
      <div class="quickitem" data-view="documents"><div class="ic2">📄</div><div class="lb">文书管理</div></div>
      <div class="quickitem" data-view="comms"><div class="ic2">💬</div><div class="lb">沟通/收费</div></div>
      <div class="quickitem" data-view="lawyers"><div class="ic2">⚖️</div><div class="lb">律师库</div></div>
    </div>
  </div>`;
}

function renderCases(){
  const filtered = db.cases.filter(c=>{
    if(state.caseFilter==='all') return true;
    if(state.caseFilter==='ongoing') return c.status==='办理中';
    if(state.caseFilter==='closed') return c.status==='已结案';
  });
  const ongoingCount = db.cases.filter(c=>c.status==='办理中').length;
  const closedCount = db.cases.filter(c=>c.status==='已结案').length;
  return `
  <div class="topbar"><h1>案件</h1><div class="actions"><div class="iconbtn" data-modal="case">＋</div></div></div>
  <div class="content">
    <div class="tabs">
      <div class="tab-btn ${state.caseFilter==='all'?'active':''}" data-filter="case:all">全部(${db.cases.length})</div>
      <div class="tab-btn ${state.caseFilter==='ongoing'?'active':''}" data-filter="case:ongoing">进行中(${ongoingCount})</div>
      <div class="tab-btn ${state.caseFilter==='closed'?'active':''}" data-filter="case:closed">已结案(${closedCount})</div>
    </div>
    ${filtered.length? filtered.map(c=>`
      <div class="card" data-open-case="${c.id}">
        <div class="row"><div class="title">${escapeHtml(c.title)}</div><span class="pill ${riskPillClass(c.risk)}">${c.risk}</span></div>
        <div class="meta">${(c.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}<span class="tag">${escapeHtml(c.stage||'')}</span></div>
        <div class="row" style="margin-top:8px;">
          <div class="meta">标的额 ¥${Number(c.amount||0).toLocaleString()}</div>
          <span class="pill ${c.status==='已结案'?'good':'warn'}">${c.status}</span>
        </div>
      </div>`).join('') : `<div class="empty">暂无案件，点右上角 ＋ 新建</div>`}
  </div>`;
}

function renderCaseDetail(){
  const c = db.cases.find(x=>x.id===state.selectedCaseId);
  if(!c){ state.view=null; return renderHome(); }
  const dls = db.deadlines.filter(d=>d.case_id===c.id);
  const tks = db.tasks.filter(t=>t.case_id===c.id);
  const evs = db.evidence.filter(e=>e.case_id===c.id);
  const docs = db.documents.filter(d=>d.case_id===c.id);
  const cms = db.comms.filter(x=>x.case_id===c.id);
  const pay = db.payments.filter(p=>p.case_id===c.id);
  const cls = db.caseLawyers.filter(x=>x.case_id===c.id);
  return `
  <div class="backbar"><div class="backbtn" data-back="cases">‹</div><h2>${escapeHtml(c.title)}</h2></div>
  <div class="content">
    <div class="card" style="cursor:default;">
      <div class="row"><div class="title">案件信息</div><span class="pill ${riskPillClass(c.risk)}">${c.risk}</span></div>
      <div class="meta">${(c.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}<span class="tag">${escapeHtml(c.stage||'')}</span></div>
      <div class="meta" style="margin-top:6px;">标的额 ¥${Number(c.amount||0).toLocaleString()} · 状态 ${c.status}</div>
      <div class="meta">立案时间 ${c.filing_date||'-'} · 立案事由 ${escapeHtml(c.filing_reason||'-')}</div>
      <div class="meta">负责人 ${escapeHtml(c.owner||'-')} · 配合部门 ${escapeHtml(c.cooperating_dept||'-')}</div>

function renderDeadlines(){
  const filtered = db.deadlines.filter(d=>{
    const dl = daysLeft(d.due_date);
    if(state.deadlineFilter==='today') return dl===0 && !d.completed;
    if(state.deadlineFilter==='d3') return dl!==null && dl<=3 && dl>=0 && !d.completed;
    if(state.deadlineFilter==='d7') return dl!==null && dl<=7 && dl>=0 && !d.completed;
    if(state.deadlineFilter==='overdue') return dl!==null && dl<0 && !d.completed;
    if(state.deadlineFilter==='done') return d.completed;
    return true;
  }).sort((a,b)=>daysLeft(a.due_date)-daysLeft(b.due_date));
  const cnt = (k)=>db.deadlines.filter(d=>{
    const dl = daysLeft(d.due_date);
    if(k==='today') return dl===0 && !d.completed;
    if(k==='d3') return dl!==null && dl<=3 && dl>=0 && !d.completed;
    if(k==='d7') return dl!==null && dl<=7 && dl>=0 && !d.completed;
    if(k==='overdue') return dl!==null && dl<0 && !d.completed;
    if(k==='done') return d.completed;
  }).length;
  return `
  <div class="topbar"><h1>期限管理</h1><div class="actions"><div class="iconbtn" data-modal="deadline">＋</div></div></div>
  <div class="content">
    <div class="tabs">
      <div class="tab-btn ${state.deadlineFilter==='all'?'active':''}" data-filter="deadline:all">全部(${db.deadlines.length})</div>
      <div class="tab-btn ${state.deadlineFilter==='today'?'active':''}" data-filter="deadline:today">今日到期(${cnt('today')})</div>
      <div class="tab-btn ${state.deadlineFilter==='d3'?'active':''}" data-filter="deadline:d3">3日内(${cnt('d3')})</div>
      <div class="tab-btn ${state.deadlineFilter==='d7'?'active':''}" data-filter="deadline:d7">7日内(${cnt('d7')})</div>
      <div class="tab-btn ${state.deadlineFilter==='overdue'?'active':''}" data-filter="deadline:overdue">已逾期(${cnt('overdue')})</div>
      <div class="tab-btn ${state.deadlineFilter==='done'?'active':''}" data-filter="deadline:done">已完成(${cnt('done')})</div>
    </div>
    ${filtered.length? filtered.map(d=>{
      const u = d.completed? {cls:'good',txt:'已完成'} : urgencyPill(daysLeft(d.due_date));
      return `<div class="card" data-open-case="${d.case_id}">
        <div class="row"><div class="title">${escapeHtml(d.title)}</div><span class="pill ${u.cls}">${u.txt}</span></div>
        <div class="meta">${escapeHtml(caseName(d.case_id))} · ${escapeHtml(d.category||'')}</div>
        <div class="row" style="margin-top:6px;"><div class="meta">${d.due_date||''}</div>
        <button class="btn small ghost" data-toggle-deadline="${d.id}">${d.completed?'标记未完成':'标记完成'}</button></div>
      </div>`;
    }).join('') : `<div class="empty">暂无期限记录</div>`}
  </div>`;
}

function caseOptions(selected){ return db.cases.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${escapeHtml(c.title)}</option>`).join(''); }

function renderModal(){
  const m = state.modal;
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  let inner = '';
  if(m.type==='case') inner = caseForm(m.editcase);
  else if(m.type==='deadline') inner = deadlineForm(m.forCaseId);
  else if(m.type==='task') inner = taskForm(m.forCaseId);
  else if(m.type==='evidence') inner = evidenceForm(m.forCaseId);
  else if(m.type==='document') inner = documentForm(m.forCaseId);
  else if(m.type==='docversion') inner = docVersionForm(m.docid);
  else if(m.type==='comm') inner = commForm(m.forCaseId);
  else if(m.type==='payment') inner = paymentForm(m.forCaseId);
  else if(m.type==='lawyer') inner = lawyerForm(m.editcase);
  else if(m.type==='caselawyer') inner = caseLawyerForm(m.forCaseId);
  wrap.innerHTML = `<div class="sheet">${inner}</div>`;
  document.getElementById('app').appendChild(wrap);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap){ state.modal=null; render(); } });
  bindModalEvents();
}

function bindModalEvents(){
  document.querySelectorAll('.segmented').forEach(seg=>{
    seg.addEventListener('click', (e)=>{
      const opt = e.target.closest('.seg-opt'); if(!opt) return;
      seg.querySelectorAll('.seg-opt').forEach(o=>o.classList.remove('on'));
      opt.classList.add('on');
    });
  });
  document.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click', ()=>{ state.modal=null; render(); }));
  document.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click', (e)=>onSave(e.target.getAttribute('data-save'), e.target)));
}
function segVal(id){ const el=document.getElementById(id); if(!el) return null; const on=el.querySelector('.seg-opt.on'); return on?on.getAttribute('data-val'):null; }
function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }

async function uploadFile(inputId){
  const el = document.getElementById(inputId);
  if(!el || !el.files || !el.files[0]) return { path:null, name:null, size:null };
  const file = el.files[0];
  const path = `${session.user.id}/${Date.now()}-${file.name}`;
  const { error } = await supabase.storage.from('case-files').upload(path, file, { upsert:false });
  if(error){ alert('文件上传失败：'+error.message); return { path:null, name:file.name, size:humanSize(file.size) }; }
  return { path, name:file.name, size:humanSize(file.size) };
}
function humanSize(bytes){
  if(bytes<1024) return bytes+'B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}
async function ensureCourt(name){
  if(!name) return null;
  let c = db.courts.find(x=>x.name===name);
  if(c) return c.id;
  const { data, error } = await supabase.from('courts').insert([{ name }]).select();
  if(error){ console.error(error); return null; }
  db.courts.push(data[0]);
  return data[0].id;
}
async function ensureJudge(name, courtId){
  if(!name) return null;
  let j = db.judges.find(x=>x.name===name);
  if(j) return j.id;
  const { data, error } = await supabase.from('judges').insert([{ name, court_id: courtId }]).select();
  if(error){ console.error(error); return null; }
  db.judges.push(data[0]);
  return data[0].id;
}

async function ensureLawyer(name, region, firm, phone, wechat, email, specialty){
  if(!name) return null;
  let l = db.lawyers.find(x=>x.name===name);
  if(l) return l.id;
  const { data, error } = await supabase.from('lawyers').insert([{ name, region: region||null, firm: firm||null, phone: phone||null, wechat: wechat||null, email: email||null, specialty: specialty||null }]).select();
  if(error){ console.error(error); return null; }
  db.lawyers.push(data[0]);
  return data[0].id;
}

async function onSave(type, btn){
  btn.disabled = true; btn.textContent = '保存中…';
  try{
    if(type==='case'){
      const title = val('f-title'); if(!title){ alert('请输入案件名称'); btn.disabled=false; return; }
      const courtId = await ensureCourt(val('f-court'));
      const judgeId = await ensureJudge(val('f-judge'), courtId);
      const payload = {
        title, tags: val('f-tags').split(',').map(s=>s.trim()).filter(Boolean),
        risk: segVal('f-risk')||'低风险', amount: Number(val('f-amount'))||0, status: segVal('f-status')||'办理中',
        stage: segVal('f-stage')||'立案', filing_date: val('f-filing-date')||null, filing_reason: val('f-filing-reason')||null,
        owner: val('f-owner')||null, cooperating_dept: val('f-dept')||null, court_id: courtId, judge_id: judgeId,
        hearing_date: val('f-hearing')?new Date(val('f-hearing')).toISOString():null, evidence_progress: val('f-evidence-progress')||null,
      };
      const editId = btn.getAttribute('data-editid');
      if(editId){ await supabase.from('cases').update(payload).eq('id', editId); }
      else{ await supabase.from('cases').insert([payload]); }
      await refetch('cases');
    } else if(type==='deadline'){
      const title = val('f-title'); if(!title){ alert('请输入期限名称'); btn.disabled=false; return; }
      await supabase.from('deadlines').insert([{ case_id: val('f-case'), title, category: val('f-category')||'其他期限', due_date: val('f-date')||todayStr(), completed:false }]);
      await refetch('deadlines');
    } else if(type==='task'){
      const title = val('f-title'); if(!title){ alert('请输入任务内容'); btn.disabled=false; return; }
      await supabase.from('tasks').insert([{ case_id: val('f-case'), title, due_date: val('f-date')||todayStr(), priority: segVal('f-priority')||'中', status:'待处理' }]);
      await refetch('tasks');
    } else if(type==='evidence'){
      const title = val('f-title'); if(!title){ alert('请输入文件名称'); btn.disabled=false; return; }
      const uploaded = await uploadFile('f-file');
      await supabase.from('evidence').insert([{ case_id: val('f-case'), title, file_type: val('f-filetype')||'其他', size: uploaded.size||'', status: segVal('f-status')||'待确认', date: todayStr(), file_url: uploaded.path }]);
      await refetch('evidence');
    } else if(type==='document'){
      const title = val('f-title'); if(!title){ alert('请输入文书名称'); btn.disabled=false; return; }
      const uploaded = await uploadFile('f-file');
      const { data, error } = await supabase.from('documents').insert([{ case_id: val('f-case'), title, doc_type: val('f-doctype')||'其他', target: val('f-target')||'', note: val('f-note')||'' }]).select();
      if(!error){
        await supabase.from('document_versions').insert([{ document_id: data[0].id, version:'v1.0', file_name: uploaded.name||(title), size: uploaded.size||'', date: todayStr(), author:'我', is_current:true, file_url: uploaded.path }]);
      }
      await refetch('documents'); await refetch('documentVersions');
    } else if(type==='docversion'){
      const docid = btn.getAttribute('data-docid');
      const uploaded = await uploadFile('f-file');
      const existingVers = db.documentVersions.filter(v=>v.document_id===docid);
      await supabase.from('document_versions').insert([{ document_id: docid, version: val('f-version')||('v'+(existingVers.length+1)+'.0'), file_name: uploaded.name||'新版本', size: uploaded.size||'', date: todayStr(), author:'我', is_current:true, file_url: uploaded.path }]);
      await refetch('documentVersions');
    } else if(type==='comm'){
      await supabase.from('comms').insert([{ case_id: val('f-case'), type: segVal('f-type')||'电话', note: val('f-note')||'', date: todayStr(), author:'我', status: segVal('f-status')||'已确认' }]);
      await refetch('comms');
    } else if(type==='payment'){
      const caseId = val('f-case');
      const existing = db.payments.find(p=>p.case_id===caseId);
      const payload = { case_id: caseId, receivable: Number(val('f-receivable'))||0, unpaid: Number(val('f-unpaid'))||0, status: segVal('f-status')||'未回款' };
      if(existing){ await supabase.from('payments').update(payload).eq('id', existing.id); }
      else{ await supabase.from('payments').insert([payload]); }
      await refetch('payments');
    } else if(type==='lawyer'){
      const name = val('f-name'); if(!name){ alert('请输入姓名'); btn.disabled=false; return; }
      const payload = { name, region: val('f-region')||null, firm: val('f-firm')||null, specialty: val('f-specialty')||null, phone: val('f-phone')||null, wechat: val('f-wechat')||null, email: val('f-email')||null, notes: val('f-notes')||null };
      const editId = btn.getAttribute('data-editid');
      if(editId){ await supabase.from('lawyers').update(payload).eq('id', editId); }
      else{ await supabase.from('lawyers').insert([payload]); }
      await refetch('lawyers');
    } else if(type==='caselawyer'){
      const name = val('f-lawyer-name'); if(!name){ alert('请输入律师姓名'); btn.disabled=false; return; }
      const lawyerId = await ensureLawyer(name, val('f-lawyer-region'), val('f-lawyer-firm'), val('f-lawyer-phone'), val('f-lawyer-wechat'), null, null);
      if(!lawyerId){ alert('保存律师信息失败'); btn.disabled=false; return; }
      await supabase.from('case_lawyers').insert([{ case_id: val('f-case'), lawyer_id: lawyerId, role: segVal('f-role')||'合作律师' }]);
      await refetch('caseLawyers'); await refetch('lawyers');
    }
  } catch(err){ console.error(err); alert('保存失败，请重试：'+err.message); }
  state.modal = null;
  render();
}

async function openFile(path){
  const { data, error } = await supabase.storage.from('case-files').createSignedUrl(path, 120);
  if(error){ alert('打开文件失败：'+error.message); return; }
  window.open(data.signedUrl, '_blank');
}

function attachEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{ state.tab = el.getAttribute('data-nav'); state.view=null; render(); }));
  document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click', ()=>{ state.view = el.getAttribute('data-view'); render(); }));
  document.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click', ()=>{ const to = el.getAttribute('data-back'); state.view=null; state.tab = to==='home'?'home':to; render(); }));
  document.querySelectorAll('[data-open-case]').forEach(el=>el.addEventListener('click', ()=>{ const id = el.getAttribute('data-open-case'); if(!id||id==='undefined') return; state.selectedCaseId=id; state.view='caseDetail'; render(); }));
  document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click', ()=>{ const [grp,valf] = el.getAttribute('data-filter').split(':'); if(grp==='case') state.caseFilter=valf; if(grp==='task') state.taskFilter=valf; if(grp==='deadline') state.deadlineFilter=valf; if(grp==='evidence') state.evidenceFilter=valf; if(grp==='lawyer') state.lawyerFilter=valf; render(); }));
  document.querySelectorAll('[data-modal]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); const type = el.getAttribute('data-modal'); const forCaseId = el.getAttribute('data-forcase') || state.selectedCaseId || (db.cases[0] && db.cases[0].id); const docid = el.getAttribute('data-docid'); const editcase = el.getAttribute('data-editcase'); state.modal = { type, forCaseId, docid, editcase }; render(); }));
  document.querySelectorAll('[data-toggle-task]').forEach(el=>el.addEventListener('click', async (e)=>{ e.stopPropagation(); const id = el.getAttribute('data-toggle-task'); const t = db.tasks.find(x=>x.id===id); const newStatus = t.status==='已完成'?'待处理':'已完成'; await supabase.from('tasks').update({status:newStatus}).eq('id', id); await refetch('tasks'); render(); }));
  document.querySelectorAll('[data-toggle-deadline]').forEach(el=>el.addEventListener('click', async (e)=>{ e.stopPropagation(); const id = el.getAttribute('data-toggle-deadline'); const d = db.deadlines.find(x=>x.id===id); await supabase.from('deadlines').update({completed: !d.completed}).eq('id', id); await refetch('deadlines'); render(); }));
  document.querySelectorAll('[data-openfile]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); openFile(el.getAttribute('data-openfile')); }));
  document.querySelectorAll('[data-logout]').forEach(el=>el.addEventListener('click', doLogout));
}

initAuth();
